<!DOCTYPE html>

<head>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

      --border:        #262626;

    .container {

    }

    .app-title {

      letter-spacing: 0.18em;
      color: var(--text-sec);

    }

    .app-subtitle {

    }

    .header-date {

    }

    .header-date-day {

    /* ─── Today Section ──────────────────────────────────────── */

      overflow: hidden;
      margin-bottom: 28px;
    }

    .today-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .today-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .today-day-title {
      font-size: 15px;
      font-weight: 500;
      margin-top: 2px;
    }

    .today-day-theme {
      font-size: 12px;
      color: var(--text-sec);
      margin-top: 1px;
    }

    /* ─── Section label ──────────────────────────────────────── */

      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ─── Exercise list ──────────────────────────────────────── */
    .ex-list {
      padding: 4px 20px 14px;
      background: #0d0d0d;
    }

    .ex-item {
      padding: 8px 0;
      border-bottom: 1px solid #161616;
    }

    .ex-item:last-child { border-bottom: none; }

    .ex-main-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    /* Custom checkbox */
    .ex-check {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      min-width: 16px;
      margin-top: 2px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      position: relative;
      transition: background 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }

    .ex-check:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .ex-check:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 8px;
      border: 1.5px solid #fff;
      border-top: none;
      border-left: none;

    .ex-body {

      min-width: 0;

      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;

    .tag-thoracic  { background: var(--thoracic-bg);  color: var(--thoracic-text);  }

      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      padding: 1px 4px;
      border-radius: 4px;
      line-height: 1;

    .vid-wrap {

      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;

      height: 32px;
      border-radius: 6px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;

    .cal-cell.partial  { background: rgba(245,158,11,0.6); color: #0a0a0a; }
    .cal-cell.future   { opacity: 0.3; cursor: default; }
    .cal-cell.today    { border: 2px solid #818cf8; color: var(--text); }
    .cal-cell:hover:not(.future) { opacity: 0.78; }
    .cal-cell-empty    { width: 32px; height: 32px; }

    .month-content {
      height: 0;
      overflow: hidden;
      transition: height 0.22s ease-out;
    }

      border-top: 1px solid var(--border-sub);
      cursor: pointer;
      transition: background 0.1s;
    }

    .day-row:hover { background: #141414; }

      display: flex;
      justify-content: space-between;
      align-items: center;

      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .day-num {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      min-width: 22px;
    }

    .day-name-label {
      font-size: 13px;
      color: var(--text-sec);
    }

    .day-row-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Day exercises container — JS-controlled height */
    .day-ex-wrap {
      height: 0;
      overflow: hidden;
      transition: height 0.18s ease-out;

      top: 18px;
      right: 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      z-index: 500;
      transition: opacity 0.15s;
      letter-spacing: 0.02em;
    }

    /* ─── Scrollbar ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
  </style>
</head>

// ─── State ────────────────────────────────────────────────────────────────────

let logData = {};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    logData = raw ? JSON.parse(raw) : {};
  } catch(e) {
    logData = {};
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logData));
}

// ─── Utilities ───────────────────────────────────────────────────────────────

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function todayKey() {
  const n = new Date();
  return dateKey(n.getFullYear(), n.getMonth(), n.getDate());
}

function getDayOfWeek(y, m, d) {
  return new Date(y, m, d).getDay();
}

function daysInMonth(y, m) {
  return new Date(y, m+1, 0).getDate();
}

function getOrInitDay(key, y, m, d) {
  if (!logData[key]) {
    const dow = getDayOfWeek(y, m, d);
    const proto = PROTOCOL[dow];
    logData[key] = {
      exercises: proto.exercises.map(e => ({
        name: e.name,
        reps: e.reps,
        done: false,
        tag: e.tag || null
      })),
      notes: ''
    };
  }
  return logData[key];
}

function calcPct(key) {
  const day = logData[key];
  if (!day || !day.exercises.length) return 0;
  const done = day.exercises.filter(e => e.done).length;
  return Math.round((done / day.exercises.length) * 100);
}

function pctClass(pct) {
  if (pct === 0)   return 'pct-zero';
  if (pct === 100) return 'pct-full';
  return 'pct-partial';
}

function pctLabel(key) {
  const day = logData[key];
  if (!day) return '';
  const done = day.exercises.filter(e => e.done).length;
  const total = day.exercises.length;
  if (done === 0 && total > 0) return `0/${total}`;
  return `${done}/${total}`;
}

function slugify(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
}

function formatFullDate(y, m, d) {
  const dt = new Date(y, m, d);
  return dt.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

// ─── Smooth height animation ──────────────────────────────────────────────────

function openPanel(el) {
  el.style.transition = 'height 0.2s ease-out';
  el.style.height = el.scrollHeight + 'px';
  el.addEventListener('transitionend', function h() {
    el.style.height = 'auto';
    el.removeEventListener('transitionend', h);
  });
}

function closePanel(el) {
  el.style.height = el.scrollHeight + 'px';
  el.offsetHeight; // force reflow
  el.style.transition = 'height 0.18s ease-out';
  el.style.height = '0';
}

// ─── updateDayPercent — TARGETED update, never rebuilds DOM ──────────────────

function updateDayPercent(key) {
  const pct = calcPct(key);
  const label = pctLabel(key);
  const cls = pctClass(pct);

  // Update all badges keyed to this date (today-view + calendar)
  document.querySelectorAll(`[data-pct="${key}"]`).forEach(el => {
    el.textContent = label;
    el.className = `pct-badge ${cls}`;
  });

  // Update calendar grid cells
  document.querySelectorAll(`[data-hm="${key}"]`).forEach(sq => {
    const tk2 = todayKey();
    let cellCls = 'cal-cell';
    if (pct === 100) cellCls += ' complete';
    else if (pct > 0) cellCls += ' partial';
    if (key > tk2) cellCls += ' future';
    if (key === tk2) cellCls += ' today';
    sq.className = cellCls;
  });
}

// ─── Render: exercise list ────────────────────────────────────────────────────

function renderExList(key, exercises) {
  const ul = document.createElement('div');
  ul.className = 'ex-list';

  exercises.forEach((ex, i) => {
    const vidId = VIDEO_MAP[ex.name];
    const vidUid = `${key}-${i}`;

    const item = document.createElement('div');
    item.className = 'ex-item';

    // Main row
    const mainRow = document.createElement('div');
    mainRow.className = 'ex-main-row';

    // Checkbox
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'ex-check';
    cb.checked = ex.done;
    cb.id = `cb-${key}-${i}`;
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', e => {
      e.stopPropagation();
      toggleExercise(key, i, cb.checked);
    });

    // Body
    const body = document.createElement('div');
    body.className = 'ex-body';

    const nameRow = document.createElement('div');
    nameRow.className = 'ex-name-row';

    const nameEl = document.createElement('span');
    nameEl.className = 'ex-name' + (ex.done ? ' done' : '');
    nameEl.id = `exname-${key}-${i}`;
    nameEl.textContent = ex.name;

    nameRow.appendChild(nameEl);

    if (ex.tag === 'MCGILL') {
      const t = document.createElement('span');
      t.className = 'tag tag-mcgill';
      t.textContent = 'McGill';
      nameRow.appendChild(t);
    } else if (ex.tag === 'THORACIC') {
      const t = document.createElement('span');
      t.className = 'tag tag-thoracic';
      t.textContent = 'Thoracic';
      nameRow.appendChild(t);
    }

    if (vidId) {
      const vbtn = document.createElement('button');
      vbtn.className = 'vid-btn';
      vbtn.title = 'Watch video';
      vbtn.textContent = '▶';
      vbtn.dataset.vidKey = `vid-${vidUid}`;
      vbtn.addEventListener('click', e => {
        e.stopPropagation();
        toggleVideo(vidUid, vidId, vbtn);
      });
      nameRow.appendChild(vbtn);
    }

    const repsEl = document.createElement('div');
    repsEl.className = 'ex-reps';
    repsEl.textContent = ex.reps;

    body.appendChild(nameRow);
    body.appendChild(repsEl);

    // Video container
    const vidWrap = document.createElement('div');
    vidWrap.className = 'vid-wrap';
    vidWrap.id = `vid-${vidUid}`;

    mainRow.appendChild(cb);
    mainRow.appendChild(body);

    item.appendChild(mainRow);
    item.appendChild(vidWrap);

    ul.appendChild(item);
  });

  // Notes
  const notesWrap = document.createElement('div');
  notesWrap.className = 'notes-wrap';
  notesWrap.addEventListener('click', e => e.stopPropagation());

  const ta = document.createElement('textarea');
  ta.className = 'notes-area';
  ta.placeholder = 'Notes for today… (e.g. felt tight in left hip)';
  ta.rows = 2;
  ta.value = (logData[key] && logData[key].notes) || '';
  ta.addEventListener('input', e => {
    e.stopPropagation();
    saveNotes(key, ta.value);
  });

  notesWrap.appendChild(ta);
  ul.appendChild(notesWrap);

  return ul;
}

// ─── Render: today section ────────────────────────────────────────────────────

function renderTodaySection() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const key = dateKey(y, m, d);
  const dow = now.getDay();
  const proto = PROTOCOL[dow];
  const data = getOrInitDay(key, y, m, d);

  const card = document.createElement('div');
  card.className = 'today-card';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'today-card-header';

  const left = document.createElement('div');
  const todayLbl = document.createElement('div');
  todayLbl.className = 'today-label';
  todayLbl.textContent = "Today's Workout";
  const dayTitle = document.createElement('div');
  dayTitle.className = 'today-day-title';
  dayTitle.textContent = `${DAY_NAMES[dow]} — ${now.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})}`;
  const dayTheme = document.createElement('div');
  dayTheme.className = 'today-day-theme';
  dayTheme.textContent = proto.theme;

  left.appendChild(todayLbl);
  left.appendChild(dayTitle);
  left.appendChild(dayTheme);

  const badge = document.createElement('span');
  badge.className = `pct-badge ${pctClass(calcPct(key))}`;
  badge.dataset.pct = key;
  badge.textContent = pctLabel(key);

  hdr.appendChild(left);
  hdr.appendChild(badge);
  card.appendChild(hdr);

  // Exercise list
  card.appendChild(renderExList(key, data.exercises));

  document.getElementById('today-section').appendChild(card);
}

// ─── Render: calendar grid ────────────────────────────────────────────────────

function renderCalGrid(mi) {
  const wrap = document.createElement('div');
  wrap.className = 'cal-grid-wrap';

  const grid = document.createElement('div');
  grid.className = 'cal-grid';

  // Day-of-week headers (ISO: Mon first)
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(h => {
    const dh = document.createElement('div');
    dh.className = 'cal-dow';
    dh.textContent = h;
    grid.appendChild(dh);
  });

  const days = daysInMonth(YEAR, mi);
  // JS getDay(): 0=Sun…6=Sat → ISO col: Mon=0…Sun=6
  const firstDow = getDayOfWeek(YEAR, mi, 1);
  const offset = (firstDow + 6) % 7;
  const tk = todayKey();

  for (let i = 0; i < offset; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell-empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= days; d++) {
    const k = dateKey(YEAR, mi, d);
    const pct = calcPct(k);
    const isFuture = k > tk;
    const isToday = k === tk;

    let cls = 'cal-cell';
    if (pct === 100) cls += ' complete';
    else if (pct > 0) cls += ' partial';
    if (isFuture) cls += ' future';
    if (isToday) cls += ' today';

    const cell = document.createElement('div');
    cell.className = cls;
    cell.dataset.hm = k;
    cell.textContent = d;

    cell.addEventListener('click', e => {
      e.stopPropagation();
      const card = document.getElementById(`month-${mi}`);
      const openAndScroll = () => {
        const dayRow = document.getElementById(`day-${k}`);
        if (!dayRow) return;
        dayRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (!dayRow.classList.contains('open')) toggleDay(k, mi);
      };
      if (card && !card.classList.contains('open')) {
        toggleMonth(mi);
        setTimeout(openAndScroll, 250);
      } else {
        openAndScroll();
      }
    });

    grid.appendChild(cell);
  }

  wrap.appendChild(grid);
  return wrap;
}

// ─── Render: month card ───────────────────────────────────────────────────────

function renderMonthCard(mi) {
  const days = daysInMonth(YEAR, mi);
  const tk = todayKey();
  const todayMi = new Date().getMonth();
  const isCurrentMonth = mi === todayMi && YEAR === new Date().getFullYear();

  const card = document.createElement('div');
  card.className = 'month-card' + (isCurrentMonth ? ' open' : '');
  card.id = `month-${mi}`;

  // Header (clickable toggle)
  const hdr = document.createElement('div');
  hdr.className = 'month-header';

  const hdrRow = document.createElement('div');
  hdrRow.className = 'month-header-row';

  const nameEl = document.createElement('span');
  nameEl.className = 'month-name-title';
  nameEl.textContent = MONTH_NAMES[mi];

  const meta = document.createElement('div');
  meta.className = 'month-meta';

  const mBadge = document.createElement('span');
  mBadge.className = `pct-badge pct-zero`;
  mBadge.id = `mpct-${mi}`;

  const chevron = document.createElement('span');
  chevron.className = 'month-chevron';
  chevron.textContent = '▼';

  meta.appendChild(mBadge);
  meta.appendChild(chevron);

  hdrRow.appendChild(nameEl);
  hdrRow.appendChild(meta);

  hdr.appendChild(hdrRow);

  hdr.addEventListener('click', e => {
    e.stopPropagation();
    toggleMonth(mi);
  });

  card.appendChild(hdr);

  // Calendar grid — always visible
  card.appendChild(renderCalGrid(mi));

  // Collapsible day list
  const content = document.createElement('div');
  content.className = 'month-content';
  content.id = `mcontent-${mi}`;

  for (let d = 1; d <= days; d++) {
    const k = dateKey(YEAR, mi, d);
    const dow = getDayOfWeek(YEAR, mi, d);
    const isToday = k === tk;

    const row = document.createElement('div');
    row.className = 'day-row' + (isToday ? ' is-today' : '');
    row.id = `day-${k}`;

    // Day header
    const rowHdr = document.createElement('div');
    rowHdr.className = 'day-row-header';

    const left = document.createElement('div');
    left.className = 'day-row-left';

    const numEl = document.createElement('span');
    numEl.className = 'day-num';
    numEl.textContent = d;

    const nameLabel = document.createElement('span');
    nameLabel.className = 'day-name-label';
    nameLabel.textContent = DAY_SHORT[dow];

    left.appendChild(numEl);
    left.appendChild(nameLabel);

    const right = document.createElement('div');
    right.className = 'day-row-right';

    const notesIco = document.createElement('span');
    notesIco.className = 'notes-icon';
    notesIco.id = `nicon-${k}`;
    if (logData[k] && logData[k].notes) notesIco.textContent = '📝';

    const badge = document.createElement('span');
    badge.className = `pct-badge ${pctClass(calcPct(k))}`;
    badge.dataset.pct = k;
    badge.textContent = pctLabel(k);

    right.appendChild(notesIco);
    right.appendChild(badge);

    rowHdr.appendChild(left);
    rowHdr.appendChild(right);

    // Exercise wrap
    const exWrap = document.createElement('div');
    exWrap.className = 'day-ex-wrap';
    exWrap.id = `dex-${k}`;

    row.appendChild(rowHdr);
    row.appendChild(exWrap);

    row.addEventListener('click', e => {
      e.stopPropagation();
      toggleDay(k, mi);
    });

    content.appendChild(row);
  }

  card.appendChild(content);

  // Set initial open state
  if (isCurrentMonth) {
    content.style.height = 'auto';
  }

  return card;
}

// ─── Render: full calendar ────────────────────────────────────────────────────

function renderCalendar() {
  const cal = document.getElementById('calendar');
  for (let mi = 0; mi < 12; mi++) {
    cal.appendChild(renderMonthCard(mi));
  }
  updateAllMonthBadges();
}

function updateAllMonthBadges() {
  for (let mi = 0; mi < 12; mi++) {
    updateMonthBadge(mi);
  }
}

function updateMonthBadge(mi) {
  const days = daysInMonth(YEAR, mi);
  let total = 0, done = 0;
  for (let d = 1; d <= days; d++) {
    const k = dateKey(YEAR, mi, d);
    const day = logData[k];
    if (day && day.exercises.length) {
      total += day.exercises.length;
      done += day.exercises.filter(e => e.done).length;
    }
  }
  const el = document.getElementById(`mpct-${mi}`);
  if (!el) return;
  if (total === 0) {
    el.className = 'pct-badge pct-zero';
    el.textContent = '';
    return;
  }
  const pct = Math.round((done/total)*100);
  el.className = `pct-badge ${pctClass(pct)}`;
  el.textContent = `${pct}%`;
}

// ─── Toggle: month ────────────────────────────────────────────────────────────

function toggleMonth(mi) {
  const card = document.getElementById(`month-${mi}`);
  const content = document.getElementById(`mcontent-${mi}`);
  const isOpen = card.classList.contains('open');

  if (isOpen) {
    card.classList.remove('open');
    closePanel(content);
  } else {
    card.classList.add('open');
    openPanel(content);
  }
}

// ─── Toggle: day ──────────────────────────────────────────────────────────────

function toggleDay(key, mi) {
  const row = document.getElementById(`day-${key}`);
  const exWrap = document.getElementById(`dex-${key}`);
  if (!row || !exWrap) return;

  const isOpen = row.classList.contains('open');

  if (isOpen) {
    row.classList.remove('open');
    closePanel(exWrap);
  } else {
    // Lazy-render exercises on first open
    if (!exWrap.dataset.rendered) {
      const parts = key.split('-');
      const y = parseInt(parts[0]), m = parseInt(parts[1])-1, d = parseInt(parts[2]);
      const data = getOrInitDay(key, y, m, d);
      saveData();
      exWrap.appendChild(renderExList(key, data.exercises));
      exWrap.dataset.rendered = '1';
      updateDayPercent(key);
      updateMonthBadge(mi);
    }
    row.classList.add('open');
    openPanel(exWrap);
  }
}

// ─── Toggle: exercise checkbox ────────────────────────────────────────────────

function toggleExercise(key, index, checked) {
  if (!logData[key]) return;
  logData[key].exercises[index].done = checked;
  saveData();

  // Update name strikethrough — targeted, no rebuild
  const nameEl = document.getElementById(`exname-${key}-${index}`);
  if (nameEl) {
    if (checked) nameEl.classList.add('done');
    else nameEl.classList.remove('done');
  }

  updateDayPercent(key);

  // Update month badge for both today section and calendar
  const parts = key.split('-');
  const mi = parseInt(parts[1]) - 1;
  updateMonthBadge(mi);
}

// ─── Toggle: video ────────────────────────────────────────────────────────────

function toggleVideo(uid, vidId, btn) {
  const wrap = document.getElementById(`vid-${uid}`);
  if (!wrap) return;

  const isOpen = wrap.classList.contains('open');

  if (isOpen) {
    wrap.classList.remove('open');
    wrap.style.maxHeight = '0';
    wrap.innerHTML = '';
    btn.classList.remove('active');
  } else {
    const inner = document.createElement('div');
    inner.className = 'vid-inner';
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${vidId}?rel=0`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    inner.appendChild(iframe);
    wrap.appendChild(inner);
    wrap.classList.add('open');
    wrap.style.maxHeight = '230px';
    btn.classList.add('active');
  }
}

// ─── Save notes ───────────────────────────────────────────────────────────────

function saveNotes(key, text) {
  if (!logData[key]) return;
  logData[key].notes = text;
  saveData();

  const icon = document.getElementById(`nicon-${key}`);
  if (icon) icon.textContent = text.trim() ? '📝' : '';
}

// ─── Scroll to today ──────────────────────────────────────────────────────────

function scrollToToday() {
  const tk = todayKey();
  const mi = new Date().getMonth();

  // Ensure month is open
  const card = document.getElementById(`month-${mi}`);
  if (card && !card.classList.contains('open')) {
    toggleMonth(mi);
    // Wait for animation then scroll
    setTimeout(() => doScrollToDay(tk, mi), 250);
  } else {
    doScrollToDay(tk, mi);
  }
}

function doScrollToDay(tk, mi) {
  const dayRow = document.getElementById(`day-${tk}`);
  if (dayRow) {
    dayRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    // Expand if not already
    if (!dayRow.classList.contains('open')) {
      toggleDay(tk, mi);
    }
  }
}

// ─── Header date ──────────────────────────────────────────────────────────────

function renderHeaderDate() {
  const now = new Date();
  const el = document.getElementById('hdr-date');
  el.innerHTML = `
    <div>${now.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})}</div>
    <div class="header-date-day">${DAY_NAMES[now.getDay()]}</div>
  `;
}

// ─── Init ─────────────────────────────────────────────────────────────────────

function init() {
  loadData();
  renderHeaderDate();
  renderTodaySection();
  renderCalendar();
}

init();
</script>
